components:

  securitySchemes:
    BasicAuth:
      type: httpApiKey
      in: query
      name: Authorization
      description: |
        Authorization query parameter in the form `Basic <API_KEY>` (URL-encoded).
        JWT Bearer tokens are also accepted (`Bearer <JWT>`).

  schemas:

    # Unified channel/model sources: https://docs.inworld.ai/api-reference/realtimeAPI/realtime/realtime-websocket
    # Provider extensions: https://docs.inworld.ai/realtime/provider-data
    # All unified objects retain additional properties for protocol forward compatibility.

    # -- Shared TTS config --------------------------------------------------
    StreamAudioEncoding:
      type: string
      enum: [AUDIO_ENCODING_UNSPECIFIED, LINEAR16, MP3, OGG_OPUS, ALAW, MULAW, PCM, WAV]

    StreamTimestampType:
      type: string
      enum: [TIMESTAMP_TYPE_UNSPECIFIED, WORD, CHARACTER]

    StreamApplyTextNormalization:
      type: string
      enum: [APPLY_TEXT_NORMALIZATION_UNSPECIFIED, 'ON', 'OFF']

    StreamDeliveryMode:
      type: string
      description: Variation and expressiveness mode for Realtime TTS-2.
      enum: [DELIVERY_MODE_UNSPECIFIED, STABLE, BALANCED, CREATIVE]

    StreamTimestampTransportStrategy:
      type: string
      enum: [TIMESTAMP_TRANSPORT_STRATEGY_UNSPECIFIED, SYNC, ASYNC]

    StreamAudioConfig:
      type: object
      description: Audio output configuration for streaming TTS.
      properties:
        audioEncoding:
          $ref: '#/components/schemas/StreamAudioEncoding'
        sampleRateHertz:
          type: integer
          format: int32
        bitRate:
          type: integer
          format: int32
        speakingRate:
          type: number
          format: double

    StreamStatus:
      type: object
      description: gRPC-style status envelope included in every server event.
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            type: object


    TtsCreateContextParams:
      type: object
      required: [voiceId, modelId]
      properties:
        voiceId:
          type: string
        modelId:
          type: string
          description: Model identifier. Use `inworld-tts-2` for flagship quality or `inworld-tts-2-flash` for the lowest latency and cost.
        audioConfig:
          $ref: '#/components/schemas/StreamAudioConfig'
        temperature:
          type: number
          format: double
        timestampType:
          $ref: '#/components/schemas/StreamTimestampType'
        maxBufferDelayMs:
          type: integer
          format: int32
        bufferCharThreshold:
          type: integer
          format: int32
        applyTextNormalization:
          $ref: '#/components/schemas/StreamApplyTextNormalization'
        deliveryMode:
          $ref: '#/components/schemas/StreamDeliveryMode'
        autoMode:
          type: boolean
        timestampTransportStrategy:
          $ref: '#/components/schemas/StreamTimestampTransportStrategy'
        language:
          type: string
          description: BCP-47 language tag (for example `en-US`, `fr-FR`, or `ja-JP`). Omit to auto-detect the input language.

    TtsSendTextParams:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Text to synthesize. Maximum 2,000 characters per request.
          maxLength: 2000
        flush_context:
          type: object
          description: Optional empty object; if set, triggers flush after text is enqueued.


    TtsWordAlignment:
      type: object
      properties:
        words:
          type: array
          items:
            type: string
        wordStartTimeSeconds:
          type: array
          items:
            type: number
            format: double
        wordEndTimeSeconds:
          type: array
          items:
            type: number
            format: double

    TtsCharacterAlignment:
      type: object
      properties:
        characters:
          type: array
          items:
            type: string
        characterStartTimeSeconds:
          type: array
          items:
            type: number
            format: double
        characterEndTimeSeconds:
          type: array
          items:
            type: number
            format: double

    TtsTimestampInfo:
      type: object
      properties:
        wordAlignment:
          $ref: '#/components/schemas/TtsWordAlignment'
        characterAlignment:
          $ref: '#/components/schemas/TtsCharacterAlignment'

    TtsStreamUsage:
      type: object
      properties:
        processedCharactersCount:
          type: integer
          format: int32
        modelId:
          type: string

    TtsAudioChunkData:
      type: object
      properties:
        audioContent:
          type: string
          format: byte
          description: Base64-encoded audio bytes.
        usage:
          $ref: '#/components/schemas/TtsStreamUsage'
        timestampInfo:
          $ref: '#/components/schemas/TtsTimestampInfo'

    TtsResultEnvelope:
      type: object
      description: |
        Server-side result envelope. Exactly one of `contextCreated`,
        `audioChunk`, `flushCompleted`, or `contextClosed` is populated.
      properties:
        contextId:
          type: string
        status:
          $ref: '#/components/schemas/StreamStatus'
        contextCreated:
          $ref: '#/components/schemas/TtsCreateContextParams'
        audioChunk:
          $ref: '#/components/schemas/TtsAudioChunkData'
        flushCompleted:
          type: object

        contextClosed:
          type: object


